# docker-compose.quickstart.yml
# LOCAL DEVELOPMENT & EVALUATION ONLY - DO NOT USE IN PRODUCTION
#
# LiteLLM quickstart stack with local PostgreSQL.
# Ports bound strictly to local loopback (127.0.0.1) to avoid public network exposure.

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.51.0
    container_name: globalfit-litellm-quickstart
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY required in .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quickstart-net

  db:
    image: postgres:16.4-alpine
    container_name: globalfit-postgres-quickstart
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - quickstart_postgres_data:/var/lib/postgresql/data
    networks:
      - quickstart-net

volumes:
  quickstart_postgres_data:

networks:
  quickstart-net:
    driver: bridge
