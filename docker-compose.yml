# docker-compose.yml
# Runs Redis and the application service locally.
# MongoDB is hosted on Atlas (cloud) — configured via MONGODB_URI in backend/.env.
# RabbitMQ is hosted on CloudAMQP — configured via RABBITMQ_URL in backend/.env.
# Local RabbitMQ is available under the "local-mq" profile if needed for offline development.

name: global_fit_ulttra

services:
  redis:
    image: redis:7-alpine
    container_name: globalfit-ulttra-redis
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backend/.env
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "protected-mode yes" > /usr/local/etc/redis/redis.conf &&
        if [ -n "$$REDIS_PASSWORD" ]; then
          echo "requirepass $${REDIS_PASSWORD}" >> /usr/local/etc/redis/redis.conf
        fi &&
        exec redis-server /usr/local/etc/redis/redis.conf
      '
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globalfit-ulttra-app
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017/global_fit_ulttra}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - LITELLM_URL=http://litellm:4000/v1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - globalfit-ulttra-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: globalfit-ulttra-rabbitmq
    hostname: rabbitmq
    security_opt:
      - no-new-privileges:true
    profiles:
      - local-mq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file:
      - ./backend/.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: globalfit-ulttra-qdrant
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: globalfit-ulttra-litellm
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    env_file:
      - ./backend/.env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

volumes:
  redis-data:
  rabbitmq-data:
  qdrant-data:

networks:
  globalfit-ulttra-network:
    driver: bridge