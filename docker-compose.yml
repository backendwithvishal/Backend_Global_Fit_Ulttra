# docker-compose.yml
# Runs ONLY Redis + RabbitMQ locally.
# MongoDB is hosted on Atlas (cloud) — no local mongo container needed.
# The backend app is run separately via: npm run backend:dev

services:
  redis:
    image: redis:7-alpine
    container_name: globalfit-ulttra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: globalfit-ulttra-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: globalfit-ulttra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: globalfit-ulttra-litellm
    ports:
      - "8000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

volumes:
  redis-data:
  rabbitmq-data:
  qdrant-data:

networks:
  globalfit-ulttra-network:
    driver: bridge