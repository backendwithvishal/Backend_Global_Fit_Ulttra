# docker-compose.yml
# Global_Fit_Ulttra - Hardened Multi-Tier Infrastructure
#
# Network Isolation Architecture:
# - "frontend": Public bridge network. Only the App (or reverse proxy) is accessible on host loopback.
# - "backend": Internal-only network (internal: true). Data stores and AI gateways are completely
#   unreachable from the host machine and external internet, preventing direct port exposure.

name: global_fit_ulttra

services:
  # ─── Application Service ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globalfit-ulttra-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Bound to loopback interface only — not 0.0.0.0 public interface
      - "127.0.0.1:4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/global_fit_ulttra?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      - LITELLM_URL=http://litellm:4000/v1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "const port = process.env.PORT || 4000; import('http').then(h => h.get('http://127.0.0.1:' + port + '/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1)))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # ─── MongoDB (Isolated Backend Only, No Host Ports) ────────────────────────
  mongo:
    image: mongo:7.0.14
    container_name: globalfit-ulttra-mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETPCAP
      - SETUID
      - SETGID
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeMeInProduction2026!}
      MONGO_INITDB_DATABASE: global_fit_ulttra
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # ─── Redis (Password-Protected, Isolated Backend Only) ──────────────────────
  redis:
    image: redis:7.2.6-alpine
    container_name: globalfit-ulttra-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      sh -c '
        exec redis-server --requirepass "$${REDIS_PASSWORD:-changeMeInProduction2026!}" --protected-mode yes
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeMeInProduction2026!}
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-changeMeInProduction2026!}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  # ─── Qdrant Vector DB (API Key Auth, Isolated Backend Only) ────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: globalfit-ulttra-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-changeMeInProduction2026!}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3' || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ─── RabbitMQ Message Broker (Non-Default Credentials, Isolated) ───────────
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: globalfit-ulttra-rabbitmq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-globalfit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeMeInProduction2026!}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ─── LiteLLM Gateway (Internal AI Gateway) ─────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:v1.51.0
    container_name: globalfit-ulttra-litellm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-globalfit-master-key-2026}
      GROQ_API_KEY: ${GROQ_API_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/health/liveliness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend

# ─── Storage Volumes ─────────────────────────────────────────────────────────
volumes:
  mongo-data:
    name: globalfit-ulttra-mongo-data
  redis-data:
    name: globalfit-ulttra-redis-data
  qdrant-data:
    name: globalfit-ulttra-qdrant-data
  rabbitmq-data:
    name: globalfit-ulttra-rabbitmq-data

# ─── Isolated Network Topologies ─────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true