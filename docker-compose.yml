# docker-compose.yml
# Runs Redis, RabbitMQ, and the application service locally.
# MongoDB is hosted on Atlas (cloud) — configured via MONGODB_URI in backend/.env.

name: global_fit_ulttra

services:
  redis:
    image: redis:7-alpine
    container_name: globalfit-ulttra-redis
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --requirepass "$$REDIS_PASSWORD"
      else
        exec redis-server
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-user932198}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-user932198}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: globalfit-ulttra-rabbitmq
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globalfit-ulttra-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017/global_fit_ulttra}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-user932198}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      - RABBITMQ_QUEUE_PREFIX=${RABBITMQ_QUEUE_PREFIX:-global_fit_ulttra}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - globalfit-ulttra-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: globalfit-ulttra-qdrant
    profiles:
      - full
      - ai-local
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: globalfit-ulttra-litellm
    profiles:
      - full
      - ai-local
    ports:
      - "127.0.0.1:8000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    env_file:
      - ./backend/.env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-default}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:-sk-default}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    networks:
      - globalfit-ulttra-network

volumes:
  redis-data:
  rabbitmq-data:
  qdrant-data:

networks:
  globalfit-ulttra-network:
    driver: bridge