# litellm-config.yaml
# Global_Fit_Ulttra - Hardened Self-Hosted LiteLLM Gateway Configuration
# All credentials sourced strictly via environment variables (os.environ/...)
# Unauthenticated and public admin endpoints disabled.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_admin_ui: true
  database_connection_pool_limit: 10

model_list:
  # Primary Financial Analysis Model (Groq LLaMA 3.3 70B)
  - model_name: llama-3.3-70b-versatile
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 60000

  # Fast Model for Chunker, Routing, and Query Classification (Groq LLaMA 3.1 8B)
  - model_name: llama-3.1-8b-instant
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 60000

  # Generic Default Alias
  - model_name: global-fit-ulttra-default
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 30
  telemetry: false

router_settings:
  routing_strategy: "latency-based-routing"
  num_retries: 2
  retry_after: 1
